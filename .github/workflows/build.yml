name: Build Smart Camera APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            python3-dev \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            unzip \
            autoconf \
            libtool \
            pkg-config

    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    - name: Pre-create Android SDK License Directories
      run: |
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        echo "24333f1a43566172ba57be40b8f67f408253d643" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a648db" >> /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Run Buildozer Debug
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: smart-camera-apk
        path: bin/*.apk
        
