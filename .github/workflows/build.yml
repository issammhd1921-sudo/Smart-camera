name: Build Smart Camera APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build with Kivy Docker Image
      uses: kivy/build-container@master
      with:
        args: buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: smart-camera-apk
        path: bin/*.apk
        
